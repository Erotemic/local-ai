[[models]]
name = "kokoro"
label = "Kokoro 82M via Wavhost"
required = false
source = "compose-command"
source_label = "Wavhost registry / hexgrad/Kokoro-82M"
destination = "{TTS_DATA_ROOT}/wavhost/.wavhost/models/manifests/registry/kokoro/kokoro"
container_path = "/state/.wavhost/models/checkpoints/kokoro/kokoro/latest"
compose_service = "wavhost"
command = ["wavhost", "pull", "kokoro", "--skip-deps", "--yes"]
check_files = ["latest"]
