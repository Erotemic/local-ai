[service]
name = "tts"
display_name = "Local TTS"
description = "Local OpenAI-compatible TTS with qwentts.cpp, Wavhost, and Kokoro backends."
compose_service = "wavhost"
compose_build_target = "wavhost"
bind_var = "TTS_BIND_ADDRESS"
port_var = "TTS_WAVHOST_PORT"
gpu_var = "TTS_WAVHOST_GPU"

[config]
required = [
  "LOCAL_AI_SERVICE_ROOT",
  "LOCAL_AI_BIND_ADDRESS",
  "HF_REPOS_ROOT",
  "TTS_DATA_ROOT",
  "TTS_BIND_ADDRESS",
  "TTS_ACTIVE_BACKEND",
  "TTS_WAVHOST_MODELS",
  "TTS_WAVHOST_PORT",
  "TTS_WAVHOST_GPU",
  "TTS_WAVHOST_IMAGE",
  "WAVHOST_DEVICE",
  "WAVHOST_QWEN_DTYPE",
  "WAVHOST_BACKEND_CACHE_SIZE",
  "TTS_TORCH_VERSION",
  "TTS_TORCHAUDIO_VERSION",
  "TTS_TORCH_CUDA_TAG",
  "TTS_QWEN_TTS_VERSION",
  "TTS_QWENTTS_PORT",
  "TTS_QWENTTS_GPU",
  "TTS_QWENTTS_IMAGE",
  "TTS_QWENTTS_MODEL_ALIAS",
  "TTS_QWENTTS_MODEL_FILE",
  "TTS_QWENTTS_CODEC_FILE",
  "TTS_QWENTTS_LANGUAGE",
  "TTS_QWENTTS_CLAMP_FP16",
  "TTS_QWENTTS_NO_FA",
  "TTS_QWENTTS_START_TIMEOUT",
  "TTS_KOKORO_PORT",
  "TTS_KOKORO_GPU",
  "TTS_KOKORO_IMAGE",
  "TTS_BENCH_QWEN_MODEL",
  "TTS_BENCH_QWEN_VOICE",
  "TTS_BENCH_QWENTTS_MODEL",
  "TTS_BENCH_QWENTTS_VOICE",
  "TTS_BENCH_KOKORO_MODEL",
  "TTS_BENCH_KOKORO_VOICE",
]

[defaults]
TTS_DATA_ROOT = "{LOCAL_AI_SERVICE_ROOT}/tts"

[model_selection]
env = "TTS_WAVHOST_MODELS"

[[directories]]
label = "TTS service state"
path = "{TTS_DATA_ROOT}"
role = "Private mutable state for local TTS runtimes"
retention = "service-owned"

[[directories]]
label = "Wavhost home"
path = "{TTS_DATA_ROOT}/wavhost"
role = "Wavhost content-addressed models, manifests, voices, and cache"
retention = "models reconstructible; saved voices may be user data"

[[directories]]
label = "Wavhost cache"
path = "{TTS_DATA_ROOT}/wavhost/cache"
role = "Hugging Face, Torch, and application caches"
retention = "disposable"

[[directories]]
label = "TTS benchmark artifacts"
path = "{TTS_DATA_ROOT}/benchmarks"
role = "Retained TTS benchmark audio, requests, metadata, and timing results"
retention = "experimental outputs; user-managed"

[[models]]
name = "qwen-0.6-customvoice"
label = "Qwen3-TTS 0.6B CustomVoice"
required = false
source = "compose-command"
source_label = "Wavhost registry / Qwen/Qwen3-TTS-12Hz-0.6B-CustomVoice"
destination = "{TTS_DATA_ROOT}/wavhost/.wavhost/models/manifests/registry/qwen/qwen-0.6-customvoice"
container_path = "/state/.wavhost/models/checkpoints/qwen/qwen-0.6-customvoice/latest"
compose_service = "wavhost"
command = ["wavhost", "pull", "qwen-0.6-customvoice", "--skip-deps", "--yes"]
check_files = ["latest"]

[[models]]
name = "qwen-1.7-customvoice"
label = "Qwen3-TTS 1.7B CustomVoice"
required = false
source = "compose-command"
source_label = "Wavhost registry / Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice"
destination = "{TTS_DATA_ROOT}/wavhost/.wavhost/models/manifests/registry/qwen/qwen-1.7-customvoice"
container_path = "/state/.wavhost/models/checkpoints/qwen/qwen-1.7-customvoice/latest"
compose_service = "wavhost"
command = ["wavhost", "pull", "qwen-1.7-customvoice", "--skip-deps", "--yes"]
check_files = ["latest"]

[[models]]
name = "qwen-0.6-base"
label = "Qwen3-TTS 0.6B Base (voice cloning)"
required = false
source = "compose-command"
source_label = "Wavhost registry / Qwen/Qwen3-TTS-12Hz-0.6B-Base"
destination = "{TTS_DATA_ROOT}/wavhost/.wavhost/models/manifests/registry/qwen/qwen-0.6-base"
container_path = "/state/.wavhost/models/checkpoints/qwen/qwen-0.6-base/latest"
compose_service = "wavhost"
command = ["wavhost", "pull", "qwen-0.6-base", "--skip-deps", "--yes"]
check_files = ["latest"]

[[models]]
name = "qwen-1.7-base"
label = "Qwen3-TTS 1.7B Base (voice cloning)"
required = false
source = "compose-command"
source_label = "Wavhost registry / Qwen/Qwen3-TTS-12Hz-1.7B-Base"
destination = "{TTS_DATA_ROOT}/wavhost/.wavhost/models/manifests/registry/qwen/qwen-1.7-base"
container_path = "/state/.wavhost/models/checkpoints/qwen/qwen-1.7-base/latest"
compose_service = "wavhost"
command = ["wavhost", "pull", "qwen-1.7-base", "--skip-deps", "--yes"]
check_files = ["latest"]

[[models]]
name = "kokoro"
label = "Kokoro 82M via Wavhost"
required = false
source = "compose-command"
source_label = "Wavhost registry / hexgrad/Kokoro-82M"
destination = "{TTS_DATA_ROOT}/wavhost/.wavhost/models/manifests/registry/hexgrad/kokoro"
container_path = "/state/.wavhost/models/checkpoints/hexgrad/kokoro/latest"
compose_service = "wavhost"
command = ["wavhost", "pull", "kokoro", "--skip-deps", "--yes"]
check_files = ["latest"]

[[models]]
name = "qwen-0.6-customvoice-q8-gguf"
label = "Qwen3-TTS 0.6B CustomVoice Q8_0 GGUF + Q8_0 codec"
required = false
source = "huggingface"
source_label = "hf://Serveurperso/Qwen3-TTS-GGUF"
repository = "Serveurperso/Qwen3-TTS-GGUF"
destination = "{HF_REPOS_ROOT}/Serveurperso/Qwen3-TTS-GGUF"
container_path = "/models"
include = [
  "qwen-talker-0.6b-customvoice-Q8_0.gguf",
  "qwen-tokenizer-12hz-Q8_0.gguf",
]
check_files = [
  "qwen-talker-0.6b-customvoice-Q8_0.gguf",
  "qwen-tokenizer-12hz-Q8_0.gguf",
]
