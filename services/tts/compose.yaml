services:
  # Raw quantized Qwen3-TTS inference engine. Normal clients should use the
  # gateway below for MP3 transport and bounded retries.
  qwentts:
    image: ${TTS_QWENTTS_IMAGE:-ghcr.io/serveurpersocom/qwentts.cpp:cuda12}
    container_name: ai-voice-qwentts
    restart: unless-stopped
    ports:
      - "${TTS_BIND_ADDRESS:-127.0.0.1}:${TTS_QWENTTS_PORT:-11436}:8080"
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      MODEL_PATH: /models/${TTS_QWENTTS_MODEL_FILE:-qwen-talker-0.6b-customvoice-Q8_0.gguf}
      CODEC_PATH: /models/${TTS_QWENTTS_CODEC_FILE:-qwen-tokenizer-12hz-Q8_0.gguf}
      MODEL_ALIAS: ${TTS_QWENTTS_MODEL_ALIAS:-qwen-0.6-customvoice-q8-ggml}
      TTS_LANG: ${TTS_QWENTTS_LANGUAGE:-English}
      HOST: 0.0.0.0
      PORT: "8080"
      CLAMP_FP16: ${TTS_QWENTTS_CLAMP_FP16:-0}
      NO_FA: ${TTS_QWENTTS_NO_FA:-0}
    volumes:
      - ${HF_REPOS_ROOT:?run ./setup.sh and use ./compose.sh}/Serveurperso/Qwen3-TTS-GGUF:/models:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${TTS_QWENTTS_GPU:-1}"]
              capabilities: ["gpu"]

  # Client-facing deployment shim for qwentts: discovery proxy, bounded
  # synthesis retries, plausibility checks, and WAV -> MP3 conversion.
  # This image is intentionally tiny and independent of any TTS runtime.
  qwentts-gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    image: ${TTS_QWENTTS_GATEWAY_IMAGE:-local/qwentts-gateway:py313}
    container_name: ai-voice-qwentts-gateway
    restart: unless-stopped
    depends_on:
      qwentts:
        condition: service_healthy
    ports:
      - "${TTS_BIND_ADDRESS:-127.0.0.1}:${TTS_QWENTTS_GATEWAY_PORT:-11437}:11437"
    environment:
      QWENTTS_UPSTREAM_URL: http://qwentts:8080
      QWENTTS_GATEWAY_HOST: 0.0.0.0
      QWENTTS_GATEWAY_PORT: "11437"
      QWENTTS_GATEWAY_RETRIES: ${TTS_QWENTTS_GATEWAY_RETRIES:-2}
      QWENTTS_MP3_BITRATE_KBPS: ${TTS_QWENTTS_MP3_BITRATE_KBPS:-64}
      QWENTTS_GATEWAY_UPSTREAM_TIMEOUT: "240"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./scripts/qwentts_gateway.py:/opt/local-ai/qwentts_gateway.py:ro
    command: ["python", "/opt/local-ai/qwentts_gateway.py"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:11437/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Known-good Pascal path. The v0.3.0 amd64 CUDA image is intentionally pinned:
  # this exact image has been verified on the GTX 1080 Ti deployment host.
  kokoro-gpu:
    image: ${TTS_KOKORO_GPU_IMAGE:-ghcr.io/remsky/kokoro-fastapi-gpu:v0.3.0-amd64}
    container_name: ai-voice-kokoro-gpu
    restart: unless-stopped
    ports:
      - "${TTS_BIND_ADDRESS:-127.0.0.1}:${TTS_KOKORO_GPU_PORT:-8880}:8880"
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      PYTHONUNBUFFERED: "1"
      API_LOG_LEVEL: INFO
      TZ: ${TZ:-Etc/UTC}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8880/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${TTS_KOKORO_GPU:-0}"]
              capabilities: ["gpu"]

  # Portable CPU-only Kokoro option. It deliberately has no NVIDIA device
  # reservation so it can be used on machines without a GPU runtime.
  kokoro-cpu:
    image: ${TTS_KOKORO_CPU_IMAGE:-ghcr.io/remsky/kokoro-fastapi-cpu:v0.3.0-amd64}
    container_name: ai-voice-kokoro-cpu
    restart: unless-stopped
    ports:
      - "${TTS_BIND_ADDRESS:-127.0.0.1}:${TTS_KOKORO_CPU_PORT:-8881}:8880"
    environment:
      PYTHONUNBUFFERED: "1"
      API_LOG_LEVEL: INFO
      TZ: ${TZ:-Etc/UTC}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8880/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # IndexTTS 2.5 experiment. The image deliberately overrides upstream's newer
  # torch/cu128 default with the Pascal-capable cu126 comparison stack.
  indextts25:
    build:
      context: ../..
      dockerfile: services/tts/Dockerfile.indextts25
      args:
        INDEXTTS_REVISION: ${TTS_INDEXTTS25_SOURCE_REVISION}
        TORCH_VERSION: ${TTS_EXPERIMENT_TORCH_VERSION}
        TORCHAUDIO_VERSION: ${TTS_EXPERIMENT_TORCHAUDIO_VERSION}
        TORCHVISION_VERSION: ${TTS_EXPERIMENT_TORCHVISION_VERSION}
        TORCH_CUDA_TAG: ${TTS_EXPERIMENT_TORCH_CUDA_TAG}
    image: ${TTS_INDEXTTS25_IMAGE}
    container_name: ai-voice-indextts25
    restart: unless-stopped
    ports:
      - "${TTS_BIND_ADDRESS:-127.0.0.1}:${TTS_INDEXTTS25_PORT:-11438}:8080"
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      HF_HOME: /cache/huggingface
      TTS_CANDIDATE_BACKEND: indextts25
      TTS_MODEL_ALIAS: ${TTS_INDEXTTS25_MODEL_ALIAS:-indextts-2.5}
      TTS_MODEL_DIR: /models
      TTS_REFERENCE_WAV: /voices/ryan.wav
      TTS_LANGUAGE: EN
      TTS_DTYPE: ${TTS_INDEXTTS25_DTYPE:-auto}
      TTS_SOURCE_REVISION: ${TTS_INDEXTTS25_SOURCE_REVISION}
      TTS_MODEL_REVISION: ${TTS_INDEXTTS25_MODEL_REVISION}
      TTS_INDEXTTS25_W2VBERT_REVISION: ${TTS_INDEXTTS25_W2VBERT_REVISION}
      TTS_INDEXTTS25_MASKGCT_REVISION: ${TTS_INDEXTTS25_MASKGCT_REVISION}
      TTS_INDEXTTS25_CAMPPLUS_REVISION: ${TTS_INDEXTTS25_CAMPPLUS_REVISION}
      TTS_INDEXTTS25_BIGVGAN_REVISION: ${TTS_INDEXTTS25_BIGVGAN_REVISION}
      TTS_HOST: 0.0.0.0
      TTS_PORT: "8080"
      PYTHONUNBUFFERED: "1"
    volumes:
      # rw is required by the explicit --provision-only setup command; normal
      # serving does not intentionally modify the checkpoint tree.
      - ${HF_REPOS_ROOT:?run ./setup.sh and use ./compose.sh}/IndexTeam/IndexTTS-2.5:/models:rw
      - ${TTS_DATA_ROOT:?run ./setup.sh and use ./compose.sh}/cache/indextts25:/cache:rw
      - ./qwen-0.6-ryan-sample.wav:/voices/ryan.wav:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${TTS_INDEXTTS25_GPU:-1}"]
              capabilities: ["gpu"]

  # Chatterbox Flash uses a pinned source tree and, initially, its portable
  # torch attention backend rather than FlashInfer so Pascal is a first-class
  # correctness target instead of an accidental fallback.
  chatterbox-flash:
    build:
      context: ../..
      dockerfile: services/tts/Dockerfile.chatterbox
      args:
        CHATTERBOX_REVISION: ${TTS_CHATTERBOX_SOURCE_REVISION}
        CHATTERBOX_FLASH_REVISION: ${TTS_CHATTERBOX_FLASH_SOURCE_REVISION}
        PERTH_REVISION: ${TTS_CHATTERBOX_PERTH_REVISION}
        TORCH_VERSION: ${TTS_EXPERIMENT_TORCH_VERSION}
        TORCHAUDIO_VERSION: ${TTS_EXPERIMENT_TORCHAUDIO_VERSION}
        TORCHVISION_VERSION: ${TTS_EXPERIMENT_TORCHVISION_VERSION}
        TORCH_CUDA_TAG: ${TTS_EXPERIMENT_TORCH_CUDA_TAG}
    image: ${TTS_CHATTERBOX_IMAGE}
    container_name: ai-voice-chatterbox-flash
    restart: unless-stopped
    ports:
      - "${TTS_BIND_ADDRESS:-127.0.0.1}:${TTS_CHATTERBOX_FLASH_PORT:-11439}:8080"
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      TTS_CANDIDATE_BACKEND: chatterbox-flash
      TTS_MODEL_ALIAS: ${TTS_CHATTERBOX_FLASH_MODEL_ALIAS:-chatterbox-flash}
      TTS_MODEL_DIR: /models
      TTS_REFERENCE_WAV: /voices/ryan.wav
      TTS_DTYPE: ${TTS_CHATTERBOX_FLASH_DTYPE:-auto}
      TTS_SOURCE_REVISION: ${TTS_CHATTERBOX_FLASH_SOURCE_REVISION}
      TTS_MODEL_REVISION: ${TTS_CHATTERBOX_FLASH_MODEL_REVISION}
      TTS_FLASH_ENGINE: ${TTS_CHATTERBOX_FLASH_ENGINE:-torch}
      TTS_FLASH_CUDA_GRAPH: ${TTS_CHATTERBOX_FLASH_CUDA_GRAPH:-0}
      TTS_FLASH_STEPS: ${TTS_CHATTERBOX_FLASH_STEPS:-10}
      TTS_HOST: 0.0.0.0
      TTS_PORT: "8080"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ${HF_REPOS_ROOT:?run ./setup.sh and use ./compose.sh}/ResembleAI/chatterbox-flash:/models:ro
      - ./qwen-0.6-ryan-sample.wav:/voices/ryan.wav:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${TTS_CHATTERBOX_FLASH_GPU:-1}"]
              capabilities: ["gpu"]

  chatterbox-nano:
    image: ${TTS_CHATTERBOX_IMAGE}
    container_name: ai-voice-chatterbox-nano
    restart: unless-stopped
    ports:
      - "${TTS_BIND_ADDRESS:-127.0.0.1}:${TTS_CHATTERBOX_NANO_PORT:-11440}:8080"
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      TTS_CANDIDATE_BACKEND: chatterbox-nano
      TTS_MODEL_ALIAS: ${TTS_CHATTERBOX_NANO_MODEL_ALIAS:-chatterbox-nano}
      TTS_MODEL_DIR: /models
      TTS_REFERENCE_WAV: /voices/ryan.wav
      TTS_SOURCE_REVISION: ${TTS_CHATTERBOX_NANO_SOURCE_REVISION}
      TTS_MODEL_REVISION: ${TTS_CHATTERBOX_NANO_MODEL_REVISION}
      TTS_HOST: 0.0.0.0
      TTS_PORT: "8080"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ${HF_REPOS_ROOT:?run ./setup.sh and use ./compose.sh}/ResembleAI/chatterbox-nano:/models:ro
      - ./qwen-0.6-ryan-sample.wav:/voices/ryan.wav:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${TTS_CHATTERBOX_NANO_GPU:-1}"]
              capabilities: ["gpu"]
