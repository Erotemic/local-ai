services:
  # Raw quantized Qwen3-TTS inference engine. Normal clients should use the
  # gateway below for MP3 transport and bounded retries.
  qwentts:
    image: ${TTS_QWENTTS_IMAGE:-ghcr.io/serveurpersocom/qwentts.cpp:cuda12}
    container_name: ai-voice-qwentts
    restart: unless-stopped
    ports:
      - "${TTS_BIND_ADDRESS:-127.0.0.1}:${TTS_QWENTTS_PORT:-11436}:8080"
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      MODEL_PATH: /models/${TTS_QWENTTS_MODEL_FILE:-qwen-talker-0.6b-customvoice-Q8_0.gguf}
      CODEC_PATH: /models/${TTS_QWENTTS_CODEC_FILE:-qwen-tokenizer-12hz-Q8_0.gguf}
      MODEL_ALIAS: ${TTS_QWENTTS_MODEL_ALIAS:-qwen-0.6-customvoice-q8-ggml}
      TTS_LANG: ${TTS_QWENTTS_LANGUAGE:-English}
      HOST: 0.0.0.0
      PORT: "8080"
      CLAMP_FP16: ${TTS_QWENTTS_CLAMP_FP16:-0}
      NO_FA: ${TTS_QWENTTS_NO_FA:-0}
    volumes:
      - ${HF_REPOS_ROOT:?run ./setup.sh and use ./compose.sh}/Serveurperso/Qwen3-TTS-GGUF:/models:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${TTS_QWENTTS_GPU:-1}"]
              capabilities: ["gpu"]

  # Client-facing deployment shim for qwentts: discovery proxy, bounded
  # synthesis retries, plausibility checks, and WAV -> MP3 conversion.
  # This image is intentionally tiny and independent of any TTS runtime.
  qwentts-gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    image: ${TTS_QWENTTS_GATEWAY_IMAGE:-local/qwentts-gateway:py313}
    container_name: ai-voice-qwentts-gateway
    restart: unless-stopped
    depends_on:
      qwentts:
        condition: service_healthy
    ports:
      - "${TTS_BIND_ADDRESS:-127.0.0.1}:${TTS_QWENTTS_GATEWAY_PORT:-11437}:11437"
    environment:
      QWENTTS_UPSTREAM_URL: http://qwentts:8080
      QWENTTS_GATEWAY_HOST: 0.0.0.0
      QWENTTS_GATEWAY_PORT: "11437"
      QWENTTS_GATEWAY_RETRIES: ${TTS_QWENTTS_GATEWAY_RETRIES:-2}
      QWENTTS_MP3_BITRATE_KBPS: ${TTS_QWENTTS_MP3_BITRATE_KBPS:-64}
      QWENTTS_GATEWAY_UPSTREAM_TIMEOUT: "240"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./scripts/qwentts_gateway.py:/opt/local-ai/qwentts_gateway.py:ro
    command: ["python", "/opt/local-ai/qwentts_gateway.py"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:11437/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Known-good Pascal path. The v0.3.0 amd64 CUDA image is intentionally pinned:
  # this exact image has been verified on the GTX 1080 Ti deployment host.
  kokoro-gpu:
    image: ${TTS_KOKORO_GPU_IMAGE:-ghcr.io/remsky/kokoro-fastapi-gpu:v0.3.0-amd64}
    container_name: ai-voice-kokoro-gpu
    restart: unless-stopped
    ports:
      - "${TTS_BIND_ADDRESS:-127.0.0.1}:${TTS_KOKORO_GPU_PORT:-8880}:8880"
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      PYTHONUNBUFFERED: "1"
      API_LOG_LEVEL: INFO
      TZ: ${TZ:-Etc/UTC}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8880/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${TTS_KOKORO_GPU:-0}"]
              capabilities: ["gpu"]

  # Portable CPU-only Kokoro option. It deliberately has no NVIDIA device
  # reservation so it can be used on machines without a GPU runtime.
  kokoro-cpu:
    image: ${TTS_KOKORO_CPU_IMAGE:-ghcr.io/remsky/kokoro-fastapi-cpu:v0.3.0-amd64}
    container_name: ai-voice-kokoro-cpu
    restart: unless-stopped
    ports:
      - "${TTS_BIND_ADDRESS:-127.0.0.1}:${TTS_KOKORO_CPU_PORT:-8881}:8880"
    environment:
      PYTHONUNBUFFERED: "1"
      API_LOG_LEVEL: INFO
      TZ: ${TZ:-Etc/UTC}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8880/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
