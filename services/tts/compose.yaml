services:
  wavhost:
    build:
      context: ../..
      dockerfile: services/tts/Dockerfile
      args:
        TORCH_VERSION: ${TTS_TORCH_VERSION:-2.14.0}
        TORCHAUDIO_VERSION: ${TTS_TORCHAUDIO_VERSION:-2.11.0}
        TORCH_CUDA_TAG: ${TTS_TORCH_CUDA_TAG:-cu126}
        QWEN_TTS_VERSION: ${TTS_QWEN_TTS_VERSION:-0.1.1}
    image: ${TTS_WAVHOST_IMAGE:-local/wavhost:pascal}
    container_name: ai-voice-wavhost
    restart: unless-stopped
    ports:
      - "${TTS_BIND_ADDRESS:-127.0.0.1}:${TTS_WAVHOST_PORT:-11435}:11435"
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      HOME: /state
      HF_HOME: /state/cache/huggingface
      TORCH_HOME: /state/cache/torch
      XDG_CACHE_HOME: /state/cache
      WAVHOST_DEVICE: ${WAVHOST_DEVICE:-cuda}
      WAVHOST_QWEN_DTYPE: ${WAVHOST_QWEN_DTYPE:-auto}
      WAVHOST_BACKEND_CACHE_SIZE: ${WAVHOST_BACKEND_CACHE_SIZE:-1}
      PYTHONUNBUFFERED: "1"
    volumes:
      - ${TTS_DATA_ROOT:?run ./setup.sh and use ./compose.sh}/wavhost:/state:rw
    command:
      - wavhost
      - serve
      - --host
      - 0.0.0.0
      - --port
      - "11435"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:11435/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${TTS_WAVHOST_GPU:-1}"]
              capabilities: ["gpu"]

  # Raw quantized inference engine. Keep this endpoint available for direct
  # benchmark/debug use; normal Android clients use qwentts-gateway below.
  qwentts:
    image: ${TTS_QWENTTS_IMAGE:-ghcr.io/serveurpersocom/qwentts.cpp:cuda12}
    container_name: ai-voice-qwentts
    restart: unless-stopped
    ports:
      - "${TTS_BIND_ADDRESS:-127.0.0.1}:${TTS_QWENTTS_PORT:-11436}:8080"
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      MODEL_PATH: /models/${TTS_QWENTTS_MODEL_FILE:-qwen-talker-0.6b-customvoice-Q8_0.gguf}
      CODEC_PATH: /models/${TTS_QWENTTS_CODEC_FILE:-qwen-tokenizer-12hz-Q8_0.gguf}
      MODEL_ALIAS: ${TTS_QWENTTS_MODEL_ALIAS:-qwen-0.6-customvoice-q8-ggml}
      TTS_LANG: ${TTS_QWENTTS_LANGUAGE:-English}
      HOST: 0.0.0.0
      PORT: "8080"
      CLAMP_FP16: ${TTS_QWENTTS_CLAMP_FP16:-0}
      NO_FA: ${TTS_QWENTTS_NO_FA:-0}
    volumes:
      - ${HF_REPOS_ROOT:?run ./setup.sh and use ./compose.sh}/Serveurperso/Qwen3-TTS-GGUF:/models:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${TTS_QWENTTS_GPU:-1}"]
              capabilities: ["gpu"]

  # Client-facing deployment shim: discovery proxy + bounded qwentts retries +
  # WAV->MP3 conversion. It reuses the already-built Wavhost image for Python
  # and ffmpeg, but does not invoke Wavhost inference.
  qwentts-gateway:
    image: ${TTS_WAVHOST_IMAGE:-local/wavhost:pascal}
    container_name: ai-voice-qwentts-gateway
    restart: unless-stopped
    depends_on:
      qwentts:
        condition: service_healthy
    ports:
      - "${TTS_BIND_ADDRESS:-127.0.0.1}:${TTS_QWENTTS_GATEWAY_PORT:-11437}:11437"
    environment:
      QWENTTS_UPSTREAM_URL: http://qwentts:8080
      QWENTTS_GATEWAY_HOST: 0.0.0.0
      QWENTTS_GATEWAY_PORT: "11437"
      QWENTTS_GATEWAY_RETRIES: ${TTS_QWENTTS_GATEWAY_RETRIES:-2}
      QWENTTS_MP3_BITRATE_KBPS: ${TTS_QWENTTS_MP3_BITRATE_KBPS:-64}
      QWENTTS_GATEWAY_UPSTREAM_TIMEOUT: "240"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./scripts/qwentts_gateway.py:/opt/local-ai/qwentts_gateway.py:ro
    command: ["python", "/opt/local-ai/qwentts_gateway.py"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:11437/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  kokoro:
    image: ${TTS_KOKORO_IMAGE:-ghcr.io/remsky/kokoro-fastapi-gpu:v0.3.0-amd64}
    container_name: ai-voice-kokoro
    restart: unless-stopped
    ports:
      - "${TTS_BIND_ADDRESS:-127.0.0.1}:${TTS_KOKORO_PORT:-8880}:8880"
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      PYTHONUNBUFFERED: "1"
      API_LOG_LEVEL: INFO
      TZ: ${TZ:-Etc/UTC}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${TTS_KOKORO_GPU:-0}"]
              capabilities: ["gpu"]
