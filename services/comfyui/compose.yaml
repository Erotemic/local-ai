services:
  comfyui:
    container_name: comfyui
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_COMFYUI_IMAGE: ${BASE_COMFYUI_IMAGE:-ghcr.io/lecode-official/comfyui-docker:latest}
        COMFYUI_REF: ${COMFYUI_REF:-v0.31.0}
    image: ${COMFYUI_IMAGE:-local/comfyui:v0.31.0}
    pull_policy: never
    restart: unless-stopped

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${PRIMARY_GPU_RESOLVED:-0}"]
              capabilities: ["gpu"]

    environment:
      USER_ID: "${USER_ID:-1000}"
      GROUP_ID: "${GROUP_ID:-1000}"
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      HF_HOME: /home/comfyui-user/.cache/huggingface
      TORCH_HOME: /home/comfyui-user/.cache/torch
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True

    ports:
      - "${LOCAL_AI_BIND_ADDRESS:-127.0.0.1}:${COMFYUI_PORT:-8188}:8188"

    volumes:
      - ${COMFY_DATA_ROOT:-/data/service/comfyui}/models:/opt/comfyui/models:rw
      - ${COMFY_DATA_ROOT:-/data/service/comfyui}/input:/opt/comfyui/input:rw
      - ${COMFY_DATA_ROOT:-/data/service/comfyui}/output:/opt/comfyui/output:rw
      - ${COMFY_DATA_ROOT:-/data/service/comfyui}/user:/opt/comfyui/user:rw
      - ${COMFY_DATA_ROOT:-/data/service/comfyui}/custom_nodes:/opt/comfyui/custom_nodes:rw
      - ${COMFY_DATA_ROOT:-/data/service/comfyui}/cache/huggingface:/home/comfyui-user/.cache/huggingface:rw
      - ${COMFY_DATA_ROOT:-/data/service/comfyui}/cache/torch:/home/comfyui-user/.cache/torch:rw
      - ${HF_REPOS_ROOT:-/data/hf-repos}:/models/hf:ro
      - ./extra_model_paths.yaml:/opt/comfyui/extra_model_paths.yaml:ro
